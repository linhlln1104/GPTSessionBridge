<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPTSessionBridge</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1>GPTSessionBridge</h1>
      <p id="status" role="status" aria-live="polite">Reading connection status…</p>
      <p class="hint">
        Connect only from a fresh chatgpt.com home page. The bridge will keep using that
        conversation.
      </p>
      <div class="actions">
        <button id="connect" type="button">Connect this tab</button>
        <button id="disconnect" type="button">Disconnect</button>
      </div>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
